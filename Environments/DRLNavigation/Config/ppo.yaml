behaviors:
  NavAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.00
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 10000
    checkpoint_interval: 25000
environment_parameters:
    num_agents: 8
    step_limit: 1000
    num_test_eps: 0
    seed: 429834740
    seeds: [429834740, 3690292277, 3957050689, 2412994845, 3989801093]
    
    time_step_penalty: -0.001
    failure_penalty: -1.0
    normalizing_distance: 80
    euclidean_step_limit: 0
    euclidean_step_scale_factor: 0.5
    
    observation_stacks: 4
    num_action_repeat: 4
    
    encode_vector_inputs: false
    use_visual_dense_layers: true
    
    observe_rel_pos: 1
    observe_global_pos: 0
    observe_velocity: 1
    observe_acceleration: 1
    observe_last_actions: 0
    
    use_raycasts: 0
    ray_length: 20
    
    use_depthmap_sensor: 1
    depthmap_width: 9
    depthmap_height: 9
    depthmap_max_angle: 45
    
    2D_init_channel: 32
    2D_kernel_size: 3
    2D_stride: 2
    2D_padding: 1
    2D_num_convs: 2
    
    occupancy_map_grid_size: 151
    occupancy_map_cell_size: 1.0
    occupancy_map_cell_size_buffer: 10
    
    use_boxcast_sensor: 1
    bc_depth: 9
    bc_height: 9
    bc_width: 9
    bc_rotate_with_agent: 0
    bc_correct_forbidden_angles: 0
    
    3D_init_channel: 32
    3D_kernel_size: 3
    3D_stride: 2
    3D_padding: 1
    3D_num_convs: 2
    
    3D_use_embedding: 0
    3D_num_embedding_dims: 16
    3D_embedding_dictionary_size: 2
    
    use_positional_embedding_sensor: 0
    positional_encoding_embedding_size: 16
    use_sestini_encoding: 1
    
    agent_type: 1
    level_type: 6
    store_positions: 1
    use_dynamics: 0
    use_dynamics_tag: 0
    
    sampling_type: 2
    sampling_half_height: 30.0
    poisson_min_radius: 5.0
    
    use_momentum: 0
    use_pitch: 1
    use_double_jump: 1
    use_slide: 0
    use_wallride: 0
    